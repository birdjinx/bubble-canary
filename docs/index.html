<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>금융 리스크 모니터 v8</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #111827; }

    .header { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid #e5e7eb; background: rgba(255,255,255,0.95); }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 16px; font-weight: 600; }
    .header-sub { font-size: 9px; color: #6b7280; letter-spacing: 1px; margin-bottom: 2px; }
    .header-meta { font-size: 9px; color: #6b7280; text-align: right; }
    .header-icon { cursor: pointer; font-size: 16px; padding: 4px 8px; }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 50; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: white; border-radius: 10px; padding: 20px; width: 92%; max-width: 420px; box-shadow: 0 20px 25px rgba(0,0,0,0.15); max-height: 88vh; overflow-y: auto; }
    .modal-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .modal-close { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 18px; color: #6b7280; }

    .form-group { margin-bottom: 10px; }
    .form-label { font-size: 10px; color: #6b7280; font-weight: 500; margin-bottom: 3px; display: block; }
    .form-input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; font-family: inherit; }
    .form-input:focus { outline: none; border-color: #3b82f6; }
    .form-hint { font-size: 9px; color: #9ca3af; margin-top: 2px; }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    button { padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; background: white; }
    button:hover { background: #f3f4f6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: white; border-color: #3b82f6; }

    .control-panel { background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 10px 16px; }
    .control-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .ctrl-btn { padding: 9px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 11px; text-align: left; }
    .ctrl-btn:hover { background: #f3f4f6; }
    .ctrl-btn:disabled { opacity: 0.5; }
    .btn-title { font-weight: 600; font-size: 11px; margin-bottom: 1px; }
    .btn-cost { font-size: 9px; color: #6b7280; }

    .status-bar { max-width: 1100px; margin: 0 auto; padding: 5px 16px; font-size: 10px; color: #6b7280; display: flex; justify-content: space-between; }
    .status-ok { color: #16a34a; }
    .status-warn { color: #f59e0b; }
    .status-error { color: #dc2626; }

    .main { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .alert { padding: 9px 12px; border-radius: 6px; border-left: 3px solid; font-size: 10px; }
    .alert.warn { border-color: #f59e0b; background: #fef3c7; color: #854d0e; }
    .alert.error { border-color: #dc2626; background: #fee2e2; color: #b91c1c; }
    .alert.info { border-color: #3b82f6; background: #eff6ff; color: #1e40af; }

    .score-card { padding: 16px; border-radius: 8px; border: 2px solid; }
    .score-card.critical { border-color: #ddd6fe; background: #faf5ff; }
    .score-card.danger   { border-color: #fca5a5; background: #fef2f2; }
    .score-card.warning  { border-color: #fed7aa; background: #fff7ed; }
    .score-card.caution  { border-color: #fde68a; background: #fefce8; }
    .score-card.stable   { border-color: #bbf7d0; background: #f0fdf4; }

    .gauge-wrap { display: flex; align-items: center; gap: 16px; }
    .gauge-svg  { flex: 0 0 180px; }
    .gauge-info { flex: 1; }

    .breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .breakdown-item { padding: 6px 8px; background: rgba(0,0,0,0.03); border-radius: 4px; font-size: 9px; }
    .breakdown-label { color: #6b7280; margin-bottom: 2px; }
    .breakdown-value { font-size: 13px; font-weight: 700; }

    .diagnosis-panel { padding: 12px 14px; background: linear-gradient(135deg, #fffbeb, #fef9ec); border: 1px solid #fde68a; border-radius: 8px; font-size: 10px; line-height: 1.65; }
    .diagnosis-section { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(253,230,138,0.5); }
    .diagnosis-section:last-child { border-bottom: none; margin-bottom: 0; }
    .diagnosis-item { padding-left: 12px; position: relative; margin-bottom: 4px; }
    .diagnosis-item:before { content: '·'; position: absolute; left: 3px; color: #92400e; }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 8px; }
    .metric-card { padding: 10px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 9px; }
    .metric-label { color: #6b7280; margin-bottom: 3px; }
    .metric-value { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .metric-badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 8px; font-weight: 600; }
    .metric-badge.normal { background: #dbeafe; color: #1e40af; }
    .metric-badge.warning { background: #fef3c7; color: #92400e; }
    .metric-badge.critical { background: #fee2e2; color: #b91c1c; }

    .net-liq { padding: 12px 16px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; }

    .footer { text-align: center; font-size: 8px; color: #9ca3af; padding: 16px 0; font-family: monospace; }
    .hidden { display: none; }
    .spinner-mini { display: inline-block; width: 12px; height: 12px; border: 2px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-sub">US FINANCIAL STRESS · v8</div>
      <div class="header-title">금융 리스크 모니터</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="header-meta">
        <div id="lastUpdated"></div>
        <div id="dataSource" style="margin-top:1px;"></div>
      </div>
      <span class="header-icon" onclick="openSettings()">⚙️</span>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <div style="position:relative;">
      <div class="modal-title">⚙️ 설정</div>
      <span class="modal-close" onclick="closeSettings()">✕</span>
    </div>
    <div class="form-group">
      <label class="form-label">Anthropic API Key (💬 분석 버튼용)</label>
      <div style="position:relative;">
        <input id="apiKeyInput" type="password" placeholder="sk-ant-..." class="form-input" style="padding-right:32px;">
        <span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;" onclick="toggleKey()">👁️</span>
      </div>
      <div class="form-hint">데이터 갱신에는 불필요. 분석 버튼에만 사용.</div>
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="saveSettings()">저장</button>
      <button onclick="closeSettings()">닫기</button>
    </div>
  </div>
</div>

<!-- Claude Analysis Modal -->
<div id="claudeModal" class="modal">
  <div class="modal-content">
    <div style="position:relative;">
      <div class="modal-title">💬 Claude 심화 분석</div>
      <span class="modal-close" onclick="document.getElementById('claudeModal').classList.remove('open')">✕</span>
    </div>
    <div id="claudeContent" style="font-size:11px;line-height:1.7;padding:4px 0;"></div>
  </div>
</div>

<!-- Control Panel -->
<div class="control-panel">
  <div class="control-inner">
    <button class="ctrl-btn" onclick="loadData()">
      <div class="btn-title">🔄 데이터 로드</div>
      <div class="btn-cost">GitHub · 무료</div>
    </button>
    <button class="ctrl-btn" id="recalcBtn" onclick="recalc()" disabled>
      <div class="btn-title">⚡ 재계산</div>
      <div class="btn-cost">로컬 · 즉시</div>
    </button>
    <button class="ctrl-btn" id="claudeBtn" onclick="showAnalysis()" disabled>
      <div class="btn-title">💬 분석</div>
      <div class="btn-cost">Claude API</div>
    </button>
  </div>
  <div class="status-bar">
    <span id="statusMsg"></span>
    <span id="apiStatus"></span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div id="alertBox"></div>
  <div id="scoreCard" class="score-card hidden"></div>
  <div id="diagnosisPanel" class="diagnosis-panel hidden"></div>
  <div id="metricsGrid" class="metrics-grid"></div>
  <div id="netLiqPanel" class="net-liq hidden"></div>
</div>

<div class="footer">
  데이터: FRED + Yahoo Finance · 매일 자동 수집 · 점수 계산: JS · v8
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const DATA_URL = 'https://birdjinx.github.io/bubble-canary/data.json';
const STORAGE_KEY = 'bcv8_';

let RAW = null;   // 수집된 원본 데이터
let SCORES = null;

let CFG = {
  apiKey: localStorage.getItem(STORAGE_KEY + 'key') || '',
};

// ═══════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════
function openSettings() {
  document.getElementById('apiKeyInput').value = CFG.apiKey;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}
function toggleKey() {
  const i = document.getElementById('apiKeyInput');
  i.type = i.type === 'password' ? 'text' : 'password';
}
function saveSettings() {
  CFG.apiKey = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem(STORAGE_KEY + 'key', CFG.apiKey);
  document.getElementById('apiStatus').innerHTML = CFG.apiKey
    ? '<span class="status-ok">✓ API 설정</span>'
    : '<span style="color:#6b7280;">API Key 없음</span>';
  closeSettings();
}

// ═══════════════════════════════════════════════════════════
// DATA LOAD (GitHub Pages)
// ═══════════════════════════════════════════════════════════
async function loadData() {
  setStatus('데이터 로드 중...');
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    RAW = await res.json();

    // 캐시 저장
    localStorage.setItem(STORAGE_KEY + 'data', JSON.stringify(RAW));

    render(RAW);
    setStatus('');
  } catch (e) {
    // 캐시 폴백
    const cached = localStorage.getItem(STORAGE_KEY + 'data');
    if (cached) {
      RAW = JSON.parse(cached);
      render(RAW);
      setAlert('warn', '⚠️ GitHub 로드 실패 → 캐시 사용 중');
    } else {
      setAlert('error', '❌ ' + e.message);
    }
    setStatus('');
  }
}

function recalc() {
  if (!RAW) return;
  render(RAW);
}

// ═══════════════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════════════
function score(data) {
  const b = { vix:0, credit:0, yc:0, liq:0, conc:0, dxy:0, sp_rsi:0, fed_gap:0, regime:0 };

  // VIX (max 20)
  if      (data.vix >= 40) b.vix = 20;
  else if (data.vix >= 30) b.vix = 14;
  else if (data.vix >= 20) b.vix = 8;
  else if (data.vix >= 15) b.vix = 4;

  // HY OAS bp (max 20)
  if      (data.hy_oas >= 550) b.credit = 20;
  else if (data.hy_oas >= 450) b.credit = 14;
  else if (data.hy_oas >= 350) b.credit = 8;
  else if (data.hy_oas >= 250) b.credit = 3;

  // Yield Curve bp (max 15)
  if      (data.yield_curve_10y2y < -200) b.yc = 15;
  else if (data.yield_curve_10y2y < -100) b.yc = 10;
  else if (data.yield_curve_10y2y <    0) b.yc = 5;

  // Net Liquidity (max 18)
  const nl = (data.fed_balance_sheet || 0) - (data.tga || 0) - (data.on_rrp || 0);
  if      (nl < 6.0) b.liq = 18;
  else if (nl < 6.5) b.liq = 11;
  else if (nl < 7.0) b.liq = 5;

  // Nasdaq 집중도 (max 12)
  if      (data.nasdaq_concentration >= 50) b.conc = 12;
  else if (data.nasdaq_concentration >= 40) b.conc = 8;
  else if (data.nasdaq_concentration >= 30) b.conc = 4;

  // DXY (max 10)
  if      (data.dxy >= 115) b.dxy = 10;
  else if (data.dxy >= 105) b.dxy = 7;
  else if (data.dxy >= 100) b.dxy = 3;

  // S&P 500 RSI (max 18)
  // 과매도(급락 진행) 또는 극도 과매수(버블 정점) 모두 위험
  if (data.sp500_rsi != null) {
    if      (data.sp500_rsi <= 20) b.sp_rsi = 18;  // 패닉 매도
    else if (data.sp500_rsi <= 30) b.sp_rsi = 12;  // 과매도 (하락 진행)
    else if (data.sp500_rsi <= 40) b.sp_rsi = 5;   // 약세 시작
    else if (data.sp500_rsi >= 80) b.sp_rsi = 15;  // 극도 과매수 (버블)
    else if (data.sp500_rsi >= 70) b.sp_rsi = 8;   // 과매수 (경계)
  }

  // Fed Policy Gap: 2Y Treasury - Fed Funds Rate (max 12)
  // 큰 음수 = 시장이 공격적 인하 기대 = 경기 위기 신호
  // 큰 양수 = 추가 인상 기대 = 금리 충격 위험
  if (data.fed_gap != null) {
    if      (data.fed_gap < -2.0) b.fed_gap = 12;  // 위기 수준 인하 기대
    else if (data.fed_gap < -1.0) b.fed_gap = 8;   // 적극 인하 기대
    else if (data.fed_gap < -0.5) b.fed_gap = 4;   // 인하 기대
    else if (data.fed_gap >  1.5) b.fed_gap = 10;  // 공격적 인상 기대
    else if (data.fed_gap >  0.75) b.fed_gap = 5;  // 인상 기대
  }

  // Regime Shift 보너스 (여러 지표 동시 경고)
  if (b.liq >= 11 && b.credit >= 8 && b.vix >= 8) b.regime = 15;

  const total = Math.min(100, Object.values(b).reduce((a, v) => a + v, 0));
  return {
    total: Math.round(total),
    b,
    level: total >= 80 ? 'CRITICAL' : total >= 60 ? 'DANGER' : total >= 40 ? 'WARNING' : total >= 20 ? 'CAUTION' : 'STABLE',
    net_liq: nl.toFixed(2),
  };
}

// ═══════════════════════════════════════════════════════════
// DIAGNOSIS
// ═══════════════════════════════════════════════════════════
function diagnose(data, s) {
  const nl = parseFloat(s.net_liq);

  const overall = {
    CRITICAL: '시장이 위기 상태입니다. 즉각적인 포지션 전면 재검토가 필요합니다.',
    DANGER:   '시장이 고위험 상태입니다. 적극적인 방어 조치가 필요합니다.',
    WARNING:  '시장에 경고 신호가 있습니다. 위험 요인을 주의 깊게 모니터링하세요.',
    CAUTION:  '시장이 다소 불안정합니다. 정기 점검을 유지하세요.',
    STABLE:   '시장이 안정적입니다.',
  }[s.level];

  const items = [];

  // VIX 해석
  if (data.vix < 15)       items.push(`VIX ${data.vix.toFixed(1)}: 변동성이 매우 낮습니다. 시장이 차분합니다.`);
  else if (data.vix < 20)  items.push(`VIX ${data.vix.toFixed(1)}: 변동성이 정상 범위입니다.`);
  else if (data.vix < 30)  items.push(`VIX ${data.vix.toFixed(1)}: 변동성이 다소 높아지고 있습니다.`);
  else                      items.push(`VIX ${data.vix.toFixed(1)}: 변동성이 높습니다. 시장 불안이 반영되었습니다.`);

  // HY OAS 해석
  if (data.hy_oas < 250)        items.push(`HY OAS ${data.hy_oas.toFixed(0)}bp: 신용 환경이 매우 양호합니다.`);
  else if (data.hy_oas < 350)   items.push(`HY OAS ${data.hy_oas.toFixed(0)}bp: 신용 환경이 양호합니다.`);
  else if (data.hy_oas < 450)   items.push(`HY OAS ${data.hy_oas.toFixed(0)}bp: 신용 스프레드가 중간 수준입니다.`);
  else                           items.push(`HY OAS ${data.hy_oas.toFixed(0)}bp: 신용 위험이 증가했습니다.`);

  // Yield Curve 해석
  if (data.yield_curve_10y2y > 100)        items.push(`10Y-2Y +${data.yield_curve_10y2y.toFixed(0)}bp: 경기 확장 신호입니다.`);
  else if (data.yield_curve_10y2y > 0)     items.push(`10Y-2Y +${data.yield_curve_10y2y.toFixed(0)}bp: 정상 경기 신호입니다.`);
  else if (data.yield_curve_10y2y > -100)  items.push(`10Y-2Y ${data.yield_curve_10y2y.toFixed(0)}bp: 경기 신호가 약화되고 있습니다.`);
  else                                      items.push(`10Y-2Y ${data.yield_curve_10y2y.toFixed(0)}bp: 경기 침체 우려 신호입니다.`);

  // Net Liquidity 해석
  if      (nl > 7.0)  items.push(`Net Liquidity ${nl}T$: 시장 유동성이 충분합니다.`);
  else if (nl > 6.5)  items.push(`Net Liquidity ${nl}T$: 유동성이 정상 수준입니다.`);
  else if (nl > 6.0)  items.push(`Net Liquidity ${nl}T$: 유동성이 다소 축소되고 있습니다.`);
  else                items.push(`Net Liquidity ${nl}T$: 유동성이 크게 줄었습니다.`);

  // DXY 해석
  if      (data.dxy < 95)   items.push(`DXY ${data.dxy.toFixed(1)}: 달러 약세로 위험자산에 우호적입니다.`);
  else if (data.dxy < 105)  items.push(`DXY ${data.dxy.toFixed(1)}: 달러가 중립 수준입니다.`);
  else                       items.push(`DXY ${data.dxy.toFixed(1)}: 달러 강세가 지속 중입니다.`);

  // Nasdaq 집중도
  if (data.nasdaq_concentration >= 50)      items.push(`Nasdaq 집중도 ${data.nasdaq_concentration.toFixed(1)}%: 매우 높은 메가캡 집중. 분산 위험 존재.`);
  else if (data.nasdaq_concentration >= 40) items.push(`Nasdaq 집중도 ${data.nasdaq_concentration.toFixed(1)}%: 상위 종목 집중도가 높습니다.`);
  else                                       items.push(`Nasdaq 집중도 ${data.nasdaq_concentration.toFixed(1)}%: 집중도가 적정 수준입니다.`);

  // S&P 500 RSI 해석
  if (data.sp500_rsi != null) {
    if      (data.sp500_rsi <= 20) items.push(`S&P RSI ${data.sp500_rsi}: 패닉 매도 구간입니다. 급락이 진행 중입니다.`);
    else if (data.sp500_rsi <= 30) items.push(`S&P RSI ${data.sp500_rsi}: 과매도 구간입니다. 하락이 상당히 진행되었습니다.`);
    else if (data.sp500_rsi <= 40) items.push(`S&P RSI ${data.sp500_rsi}: 약세 신호입니다. 조정이 시작되고 있습니다.`);
    else if (data.sp500_rsi <= 60) items.push(`S&P RSI ${data.sp500_rsi}: 중립 구간입니다. 추세 확인이 필요합니다.`);
    else if (data.sp500_rsi <= 70) items.push(`S&P RSI ${data.sp500_rsi}: 강세 구간입니다. 정상 범위입니다.`);
    else if (data.sp500_rsi <= 80) items.push(`S&P RSI ${data.sp500_rsi}: 과매수 구간입니다. 조정 가능성이 높아졌습니다.`);
    else                            items.push(`S&P RSI ${data.sp500_rsi}: 극도 과매수입니다. 버블 정점 가능성을 주의하세요.`);
    if (data.sp500_ma200_dist != null) {
      const d = data.sp500_ma200_dist;
      if      (d > 15)  items.push(`200일 MA 대비 +${d}%: 장기 평균 대비 크게 상승. 과열 신호.`);
      else if (d > 5)   items.push(`200일 MA 대비 +${d}%: 장기 상승 추세 유지 중입니다.`);
      else if (d > -5)  items.push(`200일 MA 대비 ${d}%: 장기 평균 부근입니다.`);
      else              items.push(`200일 MA 대비 ${d}%: 장기 평균 하회. 약세장 시작 신호입니다.`);
    }
  }

  // Fed Gap 해석
  if (data.fed_gap != null) {
    const g = data.fed_gap, r = data.fed_funds_rate;
    if      (g < -2.0) items.push(`Fed Gap ${g}%: 시장이 대규모 금리 인하를 기대합니다. 경기 위기 수준 신호입니다.`);
    else if (g < -1.0) items.push(`Fed Gap ${g}%: 시장이 적극적 금리 인하를 기대합니다. 경기 둔화 신호입니다.`);
    else if (g < -0.5) items.push(`Fed Gap ${g}%: 시장이 완만한 금리 인하를 기대합니다.`);
    else if (g <  0.5) items.push(`Fed Gap ${g}%: 금리 정책에 대한 시장 기대가 중립적입니다.`);
    else if (g <  1.5) items.push(`Fed Gap ${g}%: 시장이 추가 금리 인상을 기대합니다.`);
    else               items.push(`Fed Gap ${g}%: 시장이 공격적 인상을 기대합니다. 금리 충격 위험이 있습니다.`);
    if (r != null) items.push(`현재 Fed Funds Rate: ${r}%`);
  }

  // 위험 / 안정 요인
  const risks   = [];
  const stables = [];
  if (s.b.vix > 8)     risks.push('변동성'); else stables.push('변동성');
  if (s.b.credit > 8)  risks.push('신용');   else stables.push('신용');
  if (s.b.liq > 10)    risks.push('유동성'); else stables.push('유동성');
  if (s.b.yc > 5)      risks.push('경기신호');
  if (s.b.conc > 4)    risks.push('집중도');
  if (s.b.sp_rsi > 5)  risks.push('S&P 모멘텀'); else if (data.sp500_rsi != null) stables.push('S&P 모멘텀');
  if (s.b.fed_gap > 4) risks.push('금리 경로');  else if (data.fed_gap != null) stables.push('금리 경로');

  return { overall, items, risks, stables };
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render(data) {
  SCORES = score(data);
  clearAlert();

  const s = SCORES;
  const colorMap = {
    CRITICAL:'#7c3aed', DANGER:'#dc2626', WARNING:'#ea580c', CAUTION:'#ca8a04', STABLE:'#16a34a'
  };
  const labelMap = {
    CRITICAL:'위기', DANGER:'위험', WARNING:'경고', CAUTION:'주의', STABLE:'안정'
  };
  const classMap = {
    CRITICAL:'critical', DANGER:'danger', WARNING:'warning', CAUTION:'caution', STABLE:'stable'
  };
  const c = colorMap[s.level];

  // ── 반원형 게이지 생성 ──
  function buildGauge(sc) {
    const cx=100, cy=108, ro=78, ri=54;
    const segs=[
      {from:0, to:20, color:'#16a34a'},
      {from:20,to:40, color:'#ca8a04'},
      {from:40,to:60, color:'#ea580c'},
      {from:60,to:80, color:'#dc2626'},
      {from:80,to:100,color:'#7c3aed'},
    ];
    const toRad = v=>(-180+v*1.8)*Math.PI/180;
    const pt=(a,r)=>({x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)});
    const arcPath=(f,t)=>{
      const a1=toRad(f),a2=toRad(t);
      const p1=pt(a1,ro),p2=pt(a2,ro),p3=pt(a2,ri),p4=pt(a1,ri),lg=(t-f)>50?1:0;
      return `M${p1.x} ${p1.y} A${ro} ${ro} 0 ${lg} 1 ${p2.x} ${p2.y} L${p3.x} ${p3.y} A${ri} ${ri} 0 ${lg} 0 ${p4.x} ${p4.y}Z`;
    };
    const na=toRad(sc), ne=pt(na,68);
    const lbls=[
      {t:'안정',v:10},{t:'주의',v:30},{t:'경고',v:50},{t:'위험',v:70},{t:'위기',v:90}
    ];
    return `<svg viewBox="0 0 200 118" width="100%" style="display:block;">
      ${segs.map(sg=>`<path d="${arcPath(sg.from,sg.to)}" fill="${sg.color}" opacity="0.88"/>`).join('')}
      <line x1="${cx}" y1="${cy}" x2="${ne.x.toFixed(1)}" y2="${ne.y.toFixed(1)}"
            stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="#111827"/>
      <circle cx="${cx}" cy="${cy}" r="2.5" fill="white"/>
      ${lbls.map(l=>{const p=pt(toRad(l.v),92);return `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#374151" font-family="sans-serif">${l.t}</text>`;}).join('')}
    </svg>`;
  }

  // Score Card
  const sc = document.getElementById('scoreCard');
  sc.className = 'score-card ' + classMap[s.level];
  sc.innerHTML = `
    <div class="gauge-wrap">
      <div class="gauge-svg">${buildGauge(s.total)}</div>
      <div class="gauge-info">
        <div style="font-size:9px;color:#6b7280;margin-bottom:4px;">정량 리스크</div>
        <div style="font-size:12px;font-weight:700;color:${c};margin-bottom:6px;">종합 위험도 · ${labelMap[s.level]}</div>
        <div style="font-size:36px;font-family:monospace;font-weight:700;color:${c};line-height:1;">${s.total}</div>
        <div style="font-size:9px;color:#6b7280;margin-bottom:10px;">/100</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:9px;">
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">변동성</span><br/><strong>${s.b.vix}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">신용</span><br/><strong>${s.b.credit}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">경기</span><br/><strong>${s.b.yc}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">유동성</span><br/><strong>${s.b.liq}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">집중도</span><br/><strong>${s.b.conc}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">달러</span><br/><strong>${s.b.dxy}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">S&P 모멘텀</span><br/><strong>${s.b.sp_rsi}</strong></div>
          <div style="padding:4px 6px;background:rgba(0,0,0,0.03);border-radius:4px;"><span style="color:#6b7280;">금리 경로</span><br/><strong>${s.b.fed_gap}</strong></div>
        </div>
      </div>
    </div>`;
  sc.classList.remove('hidden');

  // Diagnosis
  const d = diagnose(data, s);
  const dp = document.getElementById('diagnosisPanel');
  dp.innerHTML = `
    <div class="diagnosis-section">
      <strong>📊 종합 상황</strong>
      <div class="diagnosis-item">${d.overall}</div>
    </div>
    <div class="diagnosis-section">
      <strong>📈 지표별 해석</strong>
      ${d.items.map(i => `<div class="diagnosis-item">${i}</div>`).join('')}
    </div>
    ${d.risks.length ? `<div class="diagnosis-section"><strong>⚠️ 위험 요인</strong><div class="diagnosis-item">${d.risks.join(', ')}</div></div>` : ''}
    ${d.stables.length ? `<div class="diagnosis-section"><strong>✅ 안정 요인</strong><div class="diagnosis-item">${d.stables.join(', ')}</div></div>` : ''}
  `;
  dp.classList.remove('hidden');

  // Metrics Grid (7개)
  const metrics = [
    { key:'vix',                  label:'VIX',          unit:'',   warn:20,   crit:30,  lower:false },
    { key:'hy_oas',               label:'HY OAS',       unit:'bp', warn:350,  crit:550, lower:false },
    { key:'yield_curve_10y2y',    label:'10Y-2Y',       unit:'bp', warn:-100, crit:-200,lower:true  },
    { key:'dxy',                  label:'DXY',          unit:'',   warn:105,  crit:115, lower:false },
    { key:'nasdaq_concentration', label:'Nasdaq',       unit:'%',  warn:40,   crit:50,  lower:false },
    { key:'sp500_rsi',            label:'S&P RSI',      unit:'',   warn:70,   crit:80,  lower:false,
      warn2:40, crit2:30, lower2:true },   // 과매도도 경고
    { key:'fed_gap',              label:'Fed Gap',      unit:'%',  warn:-1.0, crit:-2.0,lower:true,
      warn3:0.75, crit3:1.5, lower3:false }, // 인상 기대도 경고
  ];

  document.getElementById('metricsGrid').innerHTML = metrics.map(m => {
    const v = data[m.key];
    let badge = 'normal';
    // 주 방향 체크
    if (m.lower) {
      if (m.crit != null && v <= m.crit) badge = 'critical';
      else if (m.warn != null && v <= m.warn) badge = 'warning';
    } else {
      if (m.crit != null && v >= m.crit) badge = 'critical';
      else if (m.warn != null && v >= m.warn) badge = 'warning';
    }
    // 반대 방향 체크 (RSI 과매도, Fed Gap 인상 기대)
    if (badge === 'normal' && m.lower2 != null) {
      if (m.crit2 != null && v <= m.crit2) badge = 'critical';
      else if (m.warn2 != null && v <= m.warn2) badge = 'warning';
    }
    if (badge === 'normal' && m.crit3 != null) {
      if (v >= m.crit3) badge = 'critical';
      else if (m.warn3 != null && v >= m.warn3) badge = 'warning';
    }
    const bs = badge==='critical'
      ? 'background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;'
      : badge==='warning'
      ? 'background:#fef3c7;color:#92400e;border:1px solid #fde68a;'
      : 'background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;';
    const bt = badge==='critical'?'⚠️ 위험':badge==='warning'?'⚡ 주의':'✓ 정상';
    const display = v != null ? Number(v).toFixed(m.key==='fed_gap'?2:1) : '-';
    return `<div class="metric-card">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${display} <span style="font-size:9px;font-weight:400;color:#6b7280;">${m.unit}</span></div>
      <span style="${bs}padding:2px 7px;border-radius:4px;font-size:8px;font-weight:600;">${bt}</span>
    </div>`;
  }).join('');

  // Net Liquidity 계산식 패널
  const nlv = parseFloat(s.net_liq);
  const nlColor = nlv<6.0?'#b91c1c':nlv<6.5?'#ea580c':'#166534';
  const nlBadge = nlv<6.0
    ? 'background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;'
    : nlv<6.5
    ? 'background:#fef3c7;color:#92400e;border:1px solid #fde68a;'
    : 'background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;';
  const nlStatus = nlv<6.0?'⚠️ 위험':nlv<6.5?'⚡ 주의':'✓ 정상';

  const nlPanel = document.getElementById('netLiqPanel');
  nlPanel.innerHTML = `
    <div style="font-size:10px;font-weight:600;color:#0369a1;margin-bottom:10px;">
      💧 Net Liquidity <span style="font-weight:400;color:#6b7280;">(연준 실질 유동성)</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div style="text-align:center;">
        <div style="font-size:15px;font-weight:700;color:#1e40af;">${(data.fed_balance_sheet||0).toFixed(2)}<span style="font-size:9px;font-weight:400;color:#6b7280;"> T$</span></div>
        <div style="font-size:9px;color:#6b7280;margin-top:2px;">Fed BS</div>
      </div>
      <div style="font-size:18px;color:#9ca3af;font-weight:300;">−</div>
      <div style="text-align:center;">
        <div style="font-size:15px;font-weight:700;color:#374151;">${(data.tga||0).toFixed(2)}<span style="font-size:9px;font-weight:400;color:#6b7280;"> T$</span></div>
        <div style="font-size:9px;color:#6b7280;margin-top:2px;">TGA</div>
      </div>
      <div style="font-size:18px;color:#9ca3af;font-weight:300;">−</div>
      <div style="text-align:center;">
        <div style="font-size:15px;font-weight:700;color:#374151;">${(data.on_rrp||0).toFixed(3)}<span style="font-size:9px;font-weight:400;color:#6b7280;"> T$</span></div>
        <div style="font-size:9px;color:#6b7280;margin-top:2px;">ON RRP</div>
      </div>
      <div style="font-size:18px;color:#9ca3af;font-weight:300;">=</div>
      <div style="text-align:center;padding:8px 12px;background:rgba(255,255,255,0.8);border-radius:8px;border:1px solid #bae6fd;">
        <div style="font-size:20px;font-weight:700;color:${nlColor};">${s.net_liq}<span style="font-size:11px;"> T$</span></div>
        <div style="font-size:9px;color:#6b7280;margin-top:2px;">실질 유동성</div>
      </div>
      <span style="${nlBadge}padding:3px 8px;border-radius:4px;font-size:8px;font-weight:600;">${nlStatus}</span>
    </div>
  `;
  nlPanel.classList.remove('hidden');

  // Header meta
  if (data.updated_at) {
    const d = new Date(data.updated_at);
    document.getElementById('lastUpdated').textContent = d.toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) + ' 수집';
  }
  document.getElementById('dataSource').textContent = 'FRED + Yahoo Finance';

  document.getElementById('recalcBtn').disabled = false;
  document.getElementById('claudeBtn').disabled = !CFG.apiKey;
}

// ═══════════════════════════════════════════════════════════
// CLAUDE ANALYSIS
// ═══════════════════════════════════════════════════════════
async function showAnalysis() {
  if (!RAW || !CFG.apiKey) {
    alert('API Key를 설정하세요 (⚙️)');
    return;
  }
  const modal = document.getElementById('claudeModal');
  const content = document.getElementById('claudeContent');
  modal.classList.add('open');
  content.innerHTML = '<div style="text-align:center;padding:16px;"><div class="spinner-mini"></div><div style="margin-top:8px;font-size:10px;">분석 중...</div></div>';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CFG.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        messages: [{
          role: 'user',
          content: `US financial market data (${new Date(RAW.updated_at).toLocaleDateString('ko-KR')}):
VIX: ${RAW.vix}, HY OAS: ${RAW.hy_oas}bp, 10Y-2Y: ${RAW.yield_curve_10y2y}bp
Fed BS: ${RAW.fed_balance_sheet}T$, Net Liq: ${SCORES.net_liq}T$
DXY: ${RAW.dxy}, Risk Score: ${SCORES.total}/100 (${SCORES.level})

당신은 한국 개인투자자를 위한 미국 금융시장 해설가입니다.
아래 데이터를 바탕으로 친절하고 이해하기 쉬운 시장 브리핑을 작성하세요.

규칙:
- 전문 용어 첫 등장 시 괄호로 설명. 예: VIX(시장 공포지수), HY OAS(정크본드 위험 프리미엄), Net Liquidity(시장 실질 유동성)
- 숫자의 의미를 반드시 설명. 예: "VIX 21은 약간 불안한 수준(정상은 15~20)"
- 친근하고 명확한 한국어, 마크다운 없이 plain text

아래 4가지 항목을 각 2~3문장씩 작성(짧고 명확하게):
1. 한줄 요약: 지금 시장 분위기를 한 문장으로
2. 주요 지표 해석: 각 수치가 의미하는 바
3. 핵심 위험 요인: 가장 주의할 점
4. 투자자 시사점: 지금 어떻게 행동하면 좋을지`
        }],
      }),
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    const result = await res.json();
    content.innerHTML = result.content[0].text;
  } catch (e) {
    content.innerHTML = `<span style="color:#dc2626;">오류: ${e.message}</span>`;
  }
}
